<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branchpoint — multiverse view</title>
<style>
:root{--bg:#0a0d13;--panel:#111723;--panel2:#161e2d;--line:#243047;--txt:#e6ecf7;--mut:#a6b4cf;--good:#3ddc97;--warn:#ffb84d;--bad:#ff5d73;--acc:#7aa2ff;--acc2:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 15% -10%,#18233a 0%,var(--bg) 55%);color:var(--txt);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(10,13,19,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.3px;font-size:17px}
.logo b{color:var(--acc)}
#goal{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal q{color:var(--txt);quotes:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--mut);background:var(--panel);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.chip.on{color:var(--acc);border-color:#2f4c8f;background:#12203c}
.chip.good{color:var(--good);border-color:#1f6b4d;background:#0f2a22}
.chip.bad{color:var(--bad);border-color:#7a2a38;background:#2b1219}
.chip.warn{color:var(--warn);border-color:#7a5a22;background:#2a2012}
.chip.pulse::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.1s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#budget{min-width:210px}
#budget .bar{height:6px;background:#1a2336;border-radius:4px;overflow:hidden;margin-top:4px}
#budget .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .6s}
#budget small{color:var(--mut);font-size:11px}
main{position:relative;display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;padding:26px 22px 90px}
main.has-decision{grid-template-columns:230px minmax(0,1fr) 390px}
#sidebar{position:sticky;top:86px;align-self:start;margin-left:18px}
#trunk{position:relative;padding-right:8px}
.anchor{position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.anchor h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.anchor .sha{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--acc)}
.anchor p{margin:8px 0 0;color:var(--mut);font-size:12.5px}
#lanes{display:flex;flex-direction:column;gap:14px;position:relative}
svg#wires{position:absolute;left:-60px;top:0;width:70px;height:100%;pointer-events:none;overflow:visible}
svg#wires path{fill:none;stroke:#2d4170;stroke-width:2;stroke-linecap:round;transition:stroke .5s,opacity .5s}
.lane{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;align-items:start;transition:border-color .5s,box-shadow .6s,opacity .6s,transform .4s;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.lane.active{border-color:#34508f}
.lane.failing{border-color:#7a2a38;box-shadow:inset 3px 0 0 var(--bad)}
.lane.winner{border-color:var(--good);box-shadow:0 0 0 1px var(--good),0 0 38px rgba(61,220,151,.28)}
.lane.dim{opacity:.55}
.body{min-width:0}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;background:#15213a;color:var(--acc);border:1px solid #2b4377}
.lane.baseline .badge{background:#241a3a;color:var(--acc2);border-color:#4d3a80}
.lane.winner .badge{background:#0f2a22;color:var(--good);border-color:#1f6b4d}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700;font-size:15px}
.axis{color:var(--mut);font-size:12px}
.spacer{flex:1}
.thesis{color:var(--mut);font-size:13px;margin:2px 0 6px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.blast{display:flex;align-items:center;gap:10px}
.blast label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px}
.segs{display:flex;gap:3px}
.segs i{width:16px;height:9px;border-radius:2px;background:#2a3856;transition:background .5s}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.fact{font-size:11px;padding:1px 7px;border-radius:6px;background:#17233b;color:#a9bbdd;border:1px solid #243a62}
.fact.k{background:#2b1219;color:#ff9aa9;border-color:#6d2735}
.fact.p{background:#2a2012;color:#ffd08a;border-color:#6d531f}
.meta{display:flex;gap:16px;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:6px;flex-wrap:wrap}
.meta b{color:var(--txt);font-weight:600}
.crown{position:absolute;right:16px;top:-11px;background:var(--good);color:#06271c;font-weight:800;font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.6px;display:none}
.lane.winner .crown{display:block}
.lane.runner .crown{display:block;background:#2c3a5d;color:#cfe0ff}
.sum{margin-top:6px;color:#b8c4dc;font-size:12.5px;display:none}
.lane.done .sum{display:block}
#ticker{position:fixed;left:0;right:0;bottom:0;background:rgba(10,13,19,.94);border-top:1px solid var(--line);padding:9px 22px;font:12.5px ui-monospace,Menlo,monospace;color:var(--mut);display:flex;gap:22px;overflow:hidden;white-space:nowrap}
#ticker span{opacity:.75}#ticker span+span::before{content:'›';margin-right:22px;opacity:.5}#ticker span:last-child{opacity:1;color:var(--txt)}
#decision{display:none;background:var(--panel);border:1px solid #1f6b4d;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(61,220,151,.12);padding:16px;animation:in .7s both}
#decision.show{display:block}
@media (max-width:1180px){main.has-decision{grid-template-columns:230px minmax(0,1fr)}#sidebar{position:fixed;right:16px;bottom:48px;width:min(420px,calc(100vw - 32px));margin:0;z-index:8}}
#decision h2{margin:0 0 8px;font-size:15px}
#decision h2 em{color:var(--good);font-style:normal}
.rk{display:grid;grid-template-columns:22px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.rk .b{height:8px;background:#1a2336;border-radius:4px;overflow:hidden}.rk .b i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--good));width:0;transition:width 1s}
button{background:#17294a;color:#cfe0ff;border:1px solid #2f4c8f;border-radius:9px;padding:7px 12px;font:600 12.5px inherit;cursor:pointer}
button:hover{background:#1d3560}
#modal{position:fixed;inset:0;background:rgba(5,8,13,.8);display:none;z-index:20;padding:3vh 4vw}
#modal.show{display:block}
#doc{height:100%;overflow:auto;background:#0e1420;border:1px solid var(--line);border-radius:16px;padding:26px 34px;max-width:980px;margin:0 auto}
#doc h1{font-size:22px;margin:0 0 6px}#doc h2{font-size:17px;margin:22px 0 8px;color:var(--acc)}#doc h3{font-size:14.5px;margin:16px 0 6px}
#doc table{border-collapse:collapse;margin:10px 0;font-size:12.5px}#doc th,#doc td{border:1px solid var(--line);padding:5px 9px;text-align:left}#doc th{background:#131b2b}
#doc pre{background:#0a0f19;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px}
#doc code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#c9d8ff}
#doc blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--warn);color:#d9c9a8;background:#1d1a12}
#doc a.ref{color:var(--good);text-decoration:none;border-bottom:1px dotted var(--good);cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
#doc li{margin:4px 0}
#pop{position:fixed;display:none;max-width:640px;max-height:50vh;overflow:auto;background:#0a0f19;border:1px solid var(--good);border-radius:10px;padding:10px 12px;z-index:30;box-shadow:0 14px 50px rgba(0,0,0,.7)}
#pop h4{margin:0 0 6px;font-size:12px;color:var(--good)}#pop pre{margin:0;font-size:11.5px;white-space:pre-wrap}
#x{position:fixed;right:20px;top:14px;z-index:25;display:none}
#modal.show ~ #x{display:block}
.err{color:var(--bad);padding:30px}

/* ---- player controls ---- */
#ctl{display:none}
body.player #ctl{display:flex;position:sticky;top:58px;gap:14px;align-items:center;justify-content:center;background:var(--panel);border-bottom:1px solid var(--line);padding:7px 16px;z-index:4}
#ctl input[type=range]{width:46vw;max-width:640px;accent-color:var(--acc)}
#ctl select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:12.5px}
#pos{font:12px ui-monospace,Menlo,monospace;color:var(--mut);min-width:64px;text-align:center}
body.player main{padding-bottom:70px}

/* ---- look: FORGE (warm blueprint, engineering-bench) ---- */
[data-theme=forge]{--bg:#0e0b09;--panel:#1a1511;--panel2:#221b15;--line:#4a3a2c;--txt:#f3e9dc;--mut:#a8927c;--good:#9be564;--warn:#ffb020;--bad:#ff5a3c;--acc:#ff9a2e;--acc2:#ffd166}
html[data-theme=forge],html[data-theme=forge] body{background:linear-gradient(rgba(255,154,46,.05) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(255,154,46,.05) 1px,transparent 1px) 0 0/32px 100%,radial-gradient(1000px 600px at 15% -10%,#2f1d0e 0%,var(--bg) 62%);font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace}
[data-theme=forge] header,[data-theme=forge] #ticker,[data-theme=forge] body.player #ctl{background:rgba(14,11,9,.94)}
[data-theme=forge] .lane{border-radius:3px;border-left:5px solid var(--acc);background:linear-gradient(90deg,#241a12,#1a1511)}
[data-theme=forge] .lane.baseline{border-left-color:var(--acc2)}
[data-theme=forge] .lane.failing{border-left-color:var(--bad)}
[data-theme=forge] .lane.winner{border-left-color:var(--good);box-shadow:0 0 0 1px var(--good),0 0 44px rgba(155,229,100,.22)}
[data-theme=forge] .badge{border-radius:3px;background:#2d1f12;border-color:var(--acc);color:var(--acc)}
[data-theme=forge] .lane.winner .badge{background:#1d2a10;border-color:var(--good);color:var(--good)}
[data-theme=forge] .chip{border-radius:3px;background:#251b12;border-color:#5a4632}
[data-theme=forge] .chip.on{color:var(--acc);border-color:#8a5a22;background:#2d1d0d}
[data-theme=forge] .chip.good{color:var(--good);border-color:#496f2a;background:#18240f}
[data-theme=forge] .chip.bad{color:var(--bad);border-color:#7a2f22;background:#2c130d}
[data-theme=forge] .fact{border-radius:2px;background:#2a2016;color:#d9c3a5;border-color:#5a4632}
[data-theme=forge] .fact.k{background:#2f140d;color:#ff9b82;border-color:#7a2f22}
[data-theme=forge] .segs i{background:#33271c;border-radius:0}
[data-theme=forge] .anchor,[data-theme=forge] #decision{border-radius:3px;background:var(--panel)}
[data-theme=forge] svg#wires path{stroke:#6b4b2a}
[data-theme=forge] .logo b{color:var(--acc)}
[data-theme=forge] .crown{border-radius:2px;top:-12px}
[data-theme=forge] .segs i{background:#4a382a}
[data-theme=forge] #ctl{background:#1a1511}
[data-theme=forge] button{background:var(--acc);color:#1a0f05;border-color:var(--acc)}
[data-theme=forge] #ctl input[type=range]{accent-color:var(--acc)}
[data-theme=forge] .rk .b i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
[data-theme=forge] #budget .bar i{background:var(--acc)}
[data-theme=forge] .anchor .sha{color:var(--acc)}
[data-theme=forge] .thesis,[data-theme=forge] .axis,[data-theme=forge] .meta{color:#c4ad92}
[data-theme=forge] #ticker{color:#c4ad92}

/* ---- look: INK (light, printed-book / lab-notebook) ---- */
[data-theme=ink]{--bg:#f4ecd8;--panel:#fbf6e9;--panel2:#fffaf0;--line:#1b1b1f;--txt:#1b1b1f;--mut:#5f5a4a;--good:#17803f;--warn:#b86f00;--bad:#c42b3a;--acc:#2849b8;--acc2:#7a3fb5}
html[data-theme=ink],html[data-theme=ink] body{background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 4px),#f4ecd8;font-family:Georgia,"DejaVu Serif","Times New Roman",serif}
[data-theme=ink] header{background:rgba(244,236,216,.94);border-bottom:2px solid var(--line)}
[data-theme=ink] #ticker,[data-theme=ink] body.player #ctl{background:#fffaf0;color:var(--mut);border-color:var(--line)}
[data-theme=ink] #ticker span:last-child{color:var(--txt)}
[data-theme=ink] .logo{font-style:italic;font-size:19px}
[data-theme=ink] .logo b{color:var(--acc)}
[data-theme=ink] .lane{background:var(--panel2);border:2px solid var(--line);border-radius:14px 5px 14px 5px;box-shadow:5px 5px 0 var(--line)}
[data-theme=ink] .lane.active{border-color:var(--acc);box-shadow:5px 5px 0 var(--acc)}
[data-theme=ink] .lane.failing{border-color:var(--bad);box-shadow:5px 5px 0 var(--bad)}
[data-theme=ink] .lane.winner{border-color:var(--good);box-shadow:6px 6px 0 var(--good)}
[data-theme=ink] .lane.dim{opacity:.62}
[data-theme=ink] .lane.winner::after{content:"CHOSEN";position:absolute;right:30px;top:46px;transform:rotate(-9deg);border:3px solid var(--good);color:var(--good);padding:1px 12px;font:900 18px/1.4 Georgia,serif;letter-spacing:4px;border-radius:6px;background:rgba(255,250,240,.85)}
[data-theme=ink] .badge{background:var(--acc);color:#fff;border:2px solid var(--line);border-radius:50%;font-style:italic}
[data-theme=ink] .lane.baseline .badge{background:var(--acc2)}
[data-theme=ink] .lane.winner .badge{background:var(--good)}
[data-theme=ink] .chip{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
[data-theme=ink] .chip.on{color:var(--acc);background:#e6ebfb}
[data-theme=ink] .chip.good{color:var(--good);background:#e4f4ea}
[data-theme=ink] .chip.bad{color:var(--bad);background:#fbe6e8}
[data-theme=ink] .chip.warn{color:var(--warn);background:#fbf0d8}
[data-theme=ink] .fact{background:#efe7d0;color:#3a3628;border:1px solid #bdb190}
[data-theme=ink] .fact.k{background:#fbe6e8;color:var(--bad);border-color:#e6a4ab}
[data-theme=ink] .fact.p{background:#fbf0d8;color:var(--warn);border-color:#e4c88e}
[data-theme=ink] .segs i{background:#e2d8bc;border:1px solid #cfc29b}
[data-theme=ink] .thesis,[data-theme=ink] .axis,[data-theme=ink] .meta{color:var(--mut)}
[data-theme=ink] .meta b{color:var(--txt)}
[data-theme=ink] .sum{color:#3a3628}
[data-theme=ink] .anchor,[data-theme=ink] #decision{background:var(--panel2);border:2px solid var(--line);border-radius:12px 4px 12px 4px;box-shadow:4px 4px 0 var(--line)}
[data-theme=ink] #decision{border-color:var(--good);box-shadow:5px 5px 0 var(--good)}
[data-theme=ink] .anchor .sha{color:var(--acc)}
[data-theme=ink] svg#wires path{stroke:#1b1b1f;stroke-width:2.2;stroke-dasharray:5 4}
[data-theme=ink] .rk .b{background:#e2d8bc}.rk .b i{background:linear-gradient(90deg,var(--acc),var(--good))}
[data-theme=ink] button{background:var(--acc);color:#fff;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line)}
[data-theme=ink] #ctl select{background:#fff;color:var(--txt);border-color:var(--line)}
[data-theme=ink] #budget .bar{background:#e2d8bc}
[data-theme=ink] .crown{display:none!important}
[data-theme=ink] .lane.baseline .badge,[data-theme=ink] .lane.winner .badge{color:#fff}
[data-theme=ink] .segs i{background:#fff;border:1.5px solid #8d8466}
[data-theme=ink] #ticker{color:#3a3628}[data-theme=ink] #ticker span+span::before{color:#3a3628}
[data-theme=ink] .fact,[data-theme=ink] .fact.k,[data-theme=ink] .fact.p{font-weight:600}
[data-theme=ink] .fact.p{color:#7a4a00}[data-theme=ink] .fact.k{color:#9c1d2b}
[data-theme=ink] .chip{font-weight:700}
[data-theme=ink] #pos{color:#3a3628}
[data-theme=ink] button{background:var(--txt);color:#fffaf0;box-shadow:2px 2px 0 var(--acc)}
[data-theme=ink] .rk .b i{background:var(--txt)}
[data-theme=ink] #ctl{border-bottom:2px solid var(--line);background:#fffaf0}
[data-theme=ink] #ctl input[type=range]{accent-color:#1b1b1f}
[data-theme=ink] #budget .bar{border:1px solid #8d8466}[data-theme=ink] #budget .bar i{background:var(--txt)}
[data-theme=ink] .logo b{color:var(--acc)}
[data-theme=ink] .anchor,[data-theme=ink] .lane,[data-theme=ink] #decision{box-shadow:4px 4px 0 var(--line)}
</style>
</head>
<body>
<header>
  <div class="logo">Branch<b>point</b></div>
  <div id="goal"></div>
  <span id="status" class="chip">connecting</span>
  <div id="budget"><small id="btxt">tokens</small><div class="bar"><i id="bbar"></i></div></div>
</header>
<div id="ctl"><button id="play">▶ Play</button><input id="scrub" type="range" min="0" max="0" value="0"><span id="pos">0 / 0</span>
  <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="0.5">0.5×</option></select>
  <select id="theme"><option value="glass">Look: Glass</option><option value="forge">Look: Forge</option><option value="ink">Look: Ink</option></select></div>

<main>
  <div id="trunk"><div class="anchor"><h3>Anchor</h3><div class="sha" id="asha">…</div><p id="asrc"></p><p id="amode"></p></div></div>
  <div id="lanes"><svg id="wires"></svg></div>
  <aside id="sidebar"><div id="decision"></div></aside>
</main>
<div id="ticker"></div>
<div id="modal"><div id="doc"></div></div>
<button id="x" onclick="closeDoc()">Close ✕</button>
<div id="pop"></div>

  $("#doc").onclick=async e=>{const a=e.target.closest("a.ref");if(!a)return;
    const ev=await api("/evidence",a.dataset.ref);
    const p=$("#pop");p.innerHTML=`<h4>${esc(a.dataset.ref)} — ${esc(ev.title||"")}</h4><pre>${esc(ev.text||ev.error||"")}</pre>`;
    const b=a.getBoundingClientRect();p.style.display="block";p.style.left=Math.min(b.left,innerWidth-660)+"px";p.style.top=Math.min(b.bottom+6,innerHeight-p.offsetHeight-12)+"px"};
}
function closeDoc(){$("#modal").classList.remove("show");$("#pop").style.display="none"}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDoc()});
document.addEventListener("click",e=>{if(!e.target.closest("a.ref")&&!e.target.closest("#pop"))$("#pop").style.display="none"});
function onEvent(ev){
  switch(ev.type){
    case"strategies":
      $("#goal").innerHTML=`<q>${esc(ev.anchor.goal)}</q>`;
      $("#asha").textContent=ev.anchor.base;$("#asrc").textContent="from "+ev.anchor.source.replace(/-/g," ");
      $("#amode").textContent=ev.anchor.mode==="rewind"?`rewound to prompt ${ev.anchor.prompt_n}`:"forked from now";
      for(const s of ev.strategies){if(!state.routes[s.id]){state.order.push(s.id);state.routes[s.id]={route:s.id,name:s.name,axis:s.axis,thesis:s.thesis,status:"queued",fidelity:s.baseline?"baseline":"simulate",blast:0,issues:{},cost:{},files:{}}}}
      render();tick(`${ev.strategies.length} distinct routes${ev.rejected&&ev.rejected.length?` (${ev.rejected.length} near-duplicates rejected)`:""}`);break;
    case"route":{const r=state.routes[ev.route]||(state.order.push(ev.route),state.routes[ev.route]={});Object.assign(r,ev);
      if(ev.budget_used!=null)state.budget={used:ev.budget_used,cap:ev.budget_cap||state.budget.cap};render();tick(`${ev.route} ${ev.status} · blast ${ev.blast}/10 · ${ev.issue_total} issues`);break}
    case"status":$("#status").className="chip "+(["decided","adopted"].includes(ev.status)?"good":["failed","aborted"].includes(ev.status)?"bad":"on pulse");$("#status").textContent=ev.status;
      if(ev.budget_used!=null)state.budget.used=ev.budget_used;if(ev.budget_cap!=null)state.budget.cap=ev.budget_cap;render();tick("run "+ev.status);break;
    case"budget":state.budget={used:ev.used,cap:ev.cap};render();break;
    case"decision":showDecision(ev);tick(`council: Route ${ev.winner} wins`);break;
    case"route_log":case"log":tick(ev.message);break;
    case"base_checks":tick("baseline checks: "+(ev.results||[]).map(r=>r.kind+" "+(r.passed?"ok":"fail")).join(", "));break;
  }
}
const PARAMS=new URLSearchParams(location.search),REPLAY=PARAMS.get("replay"),UPTO=PARAMS.get("upto");
let EVS=[],playing=false,pos=0,timer=null,speed=parseFloat(REPLAY)||1;
function resetAll(){state.routes={};state.order=[];state.winner=state.runner=null;state.decided=false;state.budget.used=0;
  document.querySelectorAll("#lanes .lane").forEach(e=>e.remove());$("#decision").classList.remove("show");document.querySelector("main").classList.remove("has-decision");$("#ticker").innerHTML="";lastTick="";$("#status").className="chip";$("#status").textContent="start";render()}
function seek(n){resetAll();pos=Math.max(0,Math.min(EVS.length,n));EVS.slice(0,pos).forEach(onEvent);$("#scrub").value=pos;$("#pos").textContent=pos+" / "+EVS.length}
function delayFor(i){const e=EVS[i],n=EVS[i+1];return n?Math.max(220,Math.min(1500,(n.ts-e.ts)*1000/speed)):0}
function step(){if(!playing)return;if(pos>=EVS.length){setPlaying(false);return}onEvent(EVS[pos]);pos++;$("#scrub").value=pos;$("#pos").textContent=pos+" / "+EVS.length;timer=setTimeout(step,delayFor(pos-1))}
function setPlaying(v){playing=v;$("#play").textContent=v?"❚❚ Pause":"▶ Play";clearTimeout(timer);if(v){if(pos>=EVS.length)seek(0);step()}}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("bp-theme",t)}catch(e){}$("#theme").value=t;setTimeout(drawWires,50)}
setTheme(PARAMS.get("theme")||(()=>{try{return localStorage.getItem("bp-theme")}catch(e){return null}})()||"glass");
$("#theme").onchange=e=>setTheme(e.target.value);
if(UPTO||REPLAY||STATIC){
  document.body.classList.add("player");
  api("/state").then(j=>{EVS=j.events||[];state.budget.cap=(j.meta.settings||{}).budget_tokens||0;$("#scrub").max=EVS.length;
    $("#play").onclick=()=>setPlaying(!playing);$("#scrub").oninput=e=>{setPlaying(false);seek(parseInt(e.target.value))};
    $("#speed").onchange=e=>{speed=parseFloat(e.target.value)};
    if(UPTO){seek(parseInt(UPTO))}else{seek(0);setPlaying(true)}});
}else{const es=new EventSource(`/events?${Q}`);es.onmessage=m=>onEvent(JSON.parse(m.data));es.onerror=()=>{$("#status").textContent="reconnecting…"};
  api("/state").then(j=>{const s=j.meta&&j.meta.settings||{};state.budget.cap=s.budget_tokens||0;state.budget.used=j.meta.tokens_used||0;render()}).catch(()=>{});}
window.addEventListener("resize",drawWires);
</script>
</body>
