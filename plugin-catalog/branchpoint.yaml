sha: "7051eda3b968b90602c3c183c45f97f72153d8f7"   # Frozen 0.2.2 runtime (tag v0.2.2); later commits may update this catalogue packet only.
title: Branchpoint
description: "Takes /rewind from undo-and-retry to undo-and-explore. Give the same task to 2-8 agents (default 4), each optionally on its own model; every agent plans and builds it its own way in an isolated git worktree. From any prompt (/branchpoint rewind N) or before you build (/branchpoint fork \"<goal>\"). Each route gets a ledger of issues, bugs, blast radius, new dependencies, cost and reversibility; three blind reviewers and a judge (models you can choose) write a Decision Record in which every sentence cites ledger evidence. Every key decision and why it was made goes into a readable decision log. /branchpoint converge builds one more route from the winner plus the best ideas of the others and judges it blind with the rest. Adopt a route (merge, replay prompt, or ADR) or discard everything. Disclosure — routes run only in git worktrees under the plugin-data dir and your working tree changes only when you run adopt; the build agents get the file toolset only (no shell, no network) with writes confined to their worktree, and the plugin runs your project's test/lint/type commands inside those worktrees in an OS sandbox (bubblewrap on Linux, sandbox-exec on macOS): worktree writable, everything else read-only, home masked, no network, allowlisted environment; without a sandbox that passes its probe, real builds refuse unless you pass --unsafe-checks; it also writes git worktree metadata, route branches and dangling snapshot commits under refs/branchpoint/ in your repository (per-prompt snapshots can be switched off with anchor_on_turn). Sent to your configured Hermes model through ctx.llm: the goal, a condensed transcript before the rewind point, a repo map (paths, line counts, symbol names; secret-looking and ignored files excluded), excerpts of files a route would touch, and the route ledgers, scrubbed for common credential patterns by a local stdlib redactor (best effort, not proof of secret-free source text). Ledgers, plans, events and Decision Records are stored under <hermes home>/plugin-data/branchpoint/. The live view is an HTTP server bound to 127.0.0.1 with a per-server token. Spawns git and headless `hermes chat` processes; no telemetry, no network calls of its own, no stored credentials, no self-updater."
maintainer: Sahil-SS9
tier: community
category: tools
requires_hermes: ">=0.23.0"
