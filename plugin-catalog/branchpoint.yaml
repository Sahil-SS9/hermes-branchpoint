  provides_middleware: []
  requires_env: []
known_issues:
  - "Offline test suite runs in CI on Linux and macOS (Python 3.11 and 3.13). Running inside a real Hermes session with a real child build agent (the e2e suite) has only been exercised on Linux; macOS real-host behaviour is untested. Windows is unsupported (symlinked dependency dirs, POSIX paths)."
  - "Diversity checking is lexical plus a model check, not embedding-based; simulated routes are not evidence of correctness (their correctness score is capped) and Decision Record confidence says so."
  - "Hermes cannot fork a session from plugin code, so 'adopt replay' prints a paste-ready prompt instead of forking."
  - "Unprivileged user namespaces must be permitted for bubblewrap (Ubuntu 24.04+ restricts them by default via kernel.apparmor_restrict_unprivileged_userns=1). The probe detects this and refuses real builds rather than pretending to confine."
  - "Screenshots are pinned to the 0.2.1 release commit: the docs images are unchanged, and that is the revision whose immutable raw URLs are on the review-approved list."
  - "Confinement is an OS sandbox around every check plus a plugin-level file guard around the build agent. The sandbox is probe-verified before a build, and a host without a usable backend refuses real builds unless --unsafe-checks is passed. That bounds a route to its worktree; it is not a claim of immunity to kernel or runtime bugs."
  - "Build costs are measured only when the child reports usage; otherwise explicitly estimated. Token caps are per build, not a live cross-process hard limit. Inherited failing checks remain visible and are not release approval."
