<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branchpoint — multiverse view</title>
<style>
:root{--bg:#0a0d13;--panel:#111723;--panel2:#161e2d;--line:#243047;--txt:#e6ecf7;--mut:#a6b4cf;--good:#3ddc97;--warn:#ffb84d;--bad:#ff5d73;--acc:#7aa2ff;--acc2:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 15% -10%,#18233a 0%,var(--bg) 55%);color:var(--txt);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(10,13,19,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.3px;font-size:17px}
.logo b{color:var(--acc)}
#goal{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal q{color:var(--txt);quotes:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--mut);background:var(--panel);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.chip.on{color:var(--acc);border-color:#2f4c8f;background:#12203c}
.chip.good{color:var(--good);border-color:#1f6b4d;background:#0f2a22}
.chip.bad{color:var(--bad);border-color:#7a2a38;background:#2b1219}
.chip.warn{color:var(--warn);border-color:#7a5a22;background:#2a2012}
.chip.pulse::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.1s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#budget{min-width:210px}
#budget .bar{height:6px;background:#1a2336;border-radius:4px;overflow:hidden;margin-top:4px}
#budget .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .6s}
#budget small{color:var(--mut);font-size:11px}
main{position:relative;display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;padding:26px 22px 90px}
main.has-decision{grid-template-columns:230px minmax(0,1fr) 390px}
#sidebar{position:sticky;top:86px;align-self:start;margin-left:18px}
#trunk{position:relative;padding-right:8px}
.anchor{position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.anchor h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.anchor .sha{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--acc)}
.anchor p{margin:8px 0 0;color:var(--mut);font-size:12.5px}
#lanes{display:flex;flex-direction:column;gap:14px;position:relative}
svg#wires{position:absolute;left:-60px;top:0;width:70px;height:100%;pointer-events:none;overflow:visible}
svg#wires path{fill:none;stroke:#2d4170;stroke-width:2;stroke-linecap:round;transition:stroke .5s,opacity .5s}
.lane{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;align-items:start;transition:border-color .5s,box-shadow .6s,opacity .6s,transform .4s;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.lane.active{border-color:#34508f}
.lane.failing{border-color:#7a2a38;box-shadow:inset 3px 0 0 var(--bad)}
.lane.winner{border-color:var(--good);box-shadow:0 0 0 1px var(--good),0 0 38px rgba(61,220,151,.28)}
.lane.dim{opacity:.55}
.body{min-width:0}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;background:#15213a;color:var(--acc);border:1px solid #2b4377}
.lane.baseline .badge{background:#241a3a;color:var(--acc2);border-color:#4d3a80}
.lane.winner .badge{background:#0f2a22;color:var(--good);border-color:#1f6b4d}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700;font-size:15px}
.axis{color:var(--mut);font-size:12px}
.spacer{flex:1}
.thesis{color:var(--mut);font-size:13px;margin:2px 0 6px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.blast{display:flex;align-items:center;gap:10px}
.blast label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px}
.segs{display:flex;gap:3px}
.segs i{width:16px;height:9px;border-radius:2px;background:#2a3856;transition:background .5s}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.fact{font-size:11px;padding:1px 7px;border-radius:6px;background:#17233b;color:#a9bbdd;border:1px solid #243a62}
.fact.k{background:#2b1219;color:#ff9aa9;border-color:#6d2735}
.fact.p{background:#2a2012;color:#ffd08a;border-color:#6d531f}
.meta{display:flex;gap:16px;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:6px;flex-wrap:wrap}
.meta b{color:var(--txt);font-weight:600}
.crown{position:absolute;right:16px;top:-11px;background:var(--good);color:#06271c;font-weight:800;font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.6px;display:none}
.lane.winner .crown{display:block}
.lane.runner .crown{display:block;background:#2c3a5d;color:#cfe0ff}
.sum{margin-top:6px;color:#b8c4dc;font-size:12.5px;display:none}
.lane.done .sum{display:block}
#ticker{position:fixed;left:0;right:0;bottom:0;background:rgba(10,13,19,.94);border-top:1px solid var(--line);padding:9px 22px;font:12.5px ui-monospace,Menlo,monospace;color:var(--mut);display:flex;gap:22px;overflow:hidden;white-space:nowrap}
#ticker span{opacity:.75}#ticker span+span::before{content:'›';margin-right:22px;opacity:.5}#ticker span:last-child{opacity:1;color:var(--txt)}
#decision{display:none;background:var(--panel);border:1px solid #1f6b4d;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(61,220,151,.12);padding:16px;animation:in .7s both}
#decision.show{display:block}
@media (max-width:1180px){main.has-decision{grid-template-columns:230px minmax(0,1fr)}#sidebar{position:fixed;right:16px;bottom:48px;width:min(420px,calc(100vw - 32px));margin:0;z-index:8}}
#decision h2{margin:0 0 8px;font-size:15px}
#decision h2 em{color:var(--good);font-style:normal}
.rk{display:grid;grid-template-columns:22px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.rk .b{height:8px;background:#1a2336;border-radius:4px;overflow:hidden}.rk .b i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--good));width:0;transition:width 1s}
button{background:#17294a;color:#cfe0ff;border:1px solid #2f4c8f;border-radius:9px;padding:7px 12px;font:600 12.5px inherit;cursor:pointer}
button:hover{background:#1d3560}

.err{color:var(--bad);padding:30px}

/* ---- player controls ---- */
#ctl{display:none}
body.player #ctl{display:flex;position:sticky;top:58px;gap:14px;align-items:center;justify-content:center;background:var(--panel);border-bottom:1px solid var(--line);padding:7px 16px;z-index:4}
#ctl input[type=range]{width:46vw;max-width:640px;accent-color:var(--acc)}
#ctl select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:12.5px}
#pos{font:12px ui-monospace,Menlo,monospace;color:var(--mut);min-width:64px;text-align:center}
body.player main{padding-bottom:70px}

/* ---- look: FORGE (warm blueprint, engineering-bench) ---- */
[data-theme=forge]{--bg:#0e0b09;--panel:#1a1511;--panel2:#221b15;--line:#4a3a2c;--txt:#f3e9dc;--mut:#a8927c;--good:#9be564;--warn:#ffb020;--bad:#ff5a3c;--acc:#ff9a2e;--acc2:#ffd166}
html[data-theme=forge],html[data-theme=forge] body{background:linear-gradient(rgba(255,154,46,.05) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(255,154,46,.05) 1px,transparent 1px) 0 0/32px 100%,radial-gradient(1000px 600px at 15% -10%,#2f1d0e 0%,var(--bg) 62%);font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace}
[data-theme=forge] header,[data-theme=forge] #ticker,[data-theme=forge] body.player #ctl{background:rgba(14,11,9,.94)}
[data-theme=forge] .lane{border-radius:3px;border-left:5px solid var(--acc);background:linear-gradient(90deg,#241a12,#1a1511)}
[data-theme=forge] .lane.baseline{border-left-color:var(--acc2)}
[data-theme=forge] .lane.failing{border-left-color:var(--bad)}
[data-theme=forge] .lane.winner{border-left-color:var(--good);box-shadow:0 0 0 1px var(--good),0 0 44px rgba(155,229,100,.22)}
[data-theme=forge] .badge{border-radius:3px;background:#2d1f12;border-color:var(--acc);color:var(--acc)}
[data-theme=forge] .lane.winner .badge{background:#1d2a10;border-color:var(--good);color:var(--good)}
[data-theme=forge] .chip{border-radius:3px;background:#251b12;border-color:#5a4632}
[data-theme=forge] .chip.on{color:var(--acc);border-color:#8a5a22;background:#2d1d0d}
[data-theme=forge] .chip.good{color:var(--good);border-color:#496f2a;background:#18240f}
[data-theme=forge] .chip.bad{color:var(--bad);border-color:#7a2f22;background:#2c130d}
[data-theme=forge] .fact{border-radius:2px;background:#2a2016;color:#d9c3a5;border-color:#5a4632}
[data-theme=forge] .fact.k{background:#2f140d;color:#ff9b82;border-color:#7a2f22}
[data-theme=forge] .segs i{background:#33271c;border-radius:0}
[data-theme=forge] .anchor,[data-theme=forge] #decision{border-radius:3px;background:var(--panel)}
[data-theme=forge] svg#wires path{stroke:#6b4b2a}
[data-theme=forge] .logo b{color:var(--acc)}
[data-theme=forge] .crown{border-radius:2px;top:-12px}
[data-theme=forge] .segs i{background:#4a382a}
[data-theme=forge] #ctl{background:#1a1511}
[data-theme=forge] button{background:var(--acc);color:#1a0f05;border-color:var(--acc)}
[data-theme=forge] #ctl input[type=range]{accent-color:var(--acc)}
[data-theme=forge] .rk .b i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
[data-theme=forge] #budget .bar i{background:var(--acc)}
[data-theme=forge] .anchor .sha{color:var(--acc)}
[data-theme=forge] .thesis,[data-theme=forge] .axis,[data-theme=forge] .meta{color:#c4ad92}
[data-theme=forge] #ticker{color:#c4ad92}

/* ---- look: INK (light, printed-book / lab-notebook) ---- */
[data-theme=ink]{--bg:#f4ecd8;--panel:#fbf6e9;--panel2:#fffaf0;--line:#1b1b1f;--txt:#1b1b1f;--mut:#5f5a4a;--good:#17803f;--warn:#b86f00;--bad:#c42b3a;--acc:#2849b8;--acc2:#7a3fb5}
html[data-theme=ink],html[data-theme=ink] body{background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 4px),#f4ecd8;font-family:Georgia,"DejaVu Serif","Times New Roman",serif}
[data-theme=ink] header{background:rgba(244,236,216,.94);border-bottom:2px solid var(--line)}
[data-theme=ink] #ticker,[data-theme=ink] body.player #ctl{background:#fffaf0;color:var(--mut);border-color:var(--line)}
[data-theme=ink] #ticker span:last-child{color:var(--txt)}
[data-theme=ink] .logo{font-style:italic;font-size:19px}
[data-theme=ink] .logo b{color:var(--acc)}
[data-theme=ink] .lane{background:var(--panel2);border:2px solid var(--line);border-radius:14px 5px 14px 5px;box-shadow:5px 5px 0 var(--line)}
[data-theme=ink] .lane.active{border-color:var(--acc);box-shadow:5px 5px 0 var(--acc)}
[data-theme=ink] .lane.failing{border-color:var(--bad);box-shadow:5px 5px 0 var(--bad)}
[data-theme=ink] .lane.winner{border-color:var(--good);box-shadow:6px 6px 0 var(--good)}
[data-theme=ink] .lane.dim{opacity:.62}
[data-theme=ink] .lane.winner::after{content:"CHOSEN";position:absolute;right:30px;top:46px;transform:rotate(-9deg);border:3px solid var(--good);color:var(--good);padding:1px 12px;font:900 18px/1.4 Georgia,serif;letter-spacing:4px;border-radius:6px;background:rgba(255,250,240,.85)}
[data-theme=ink] .badge{background:var(--acc);color:#fff;border:2px solid var(--line);border-radius:50%;font-style:italic}
[data-theme=ink] .lane.baseline .badge{background:var(--acc2)}
[data-theme=ink] .lane.winner .badge{background:var(--good)}
[data-theme=ink] .chip{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
[data-theme=ink] .chip.on{color:var(--acc);background:#e6ebfb}
[data-theme=ink] .chip.good{color:var(--good);background:#e4f4ea}
[data-theme=ink] .chip.bad{color:var(--bad);background:#fbe6e8}
[data-theme=ink] .chip.warn{color:var(--warn);background:#fbf0d8}
[data-theme=ink] .fact{background:#efe7d0;color:#3a3628;border:1px solid #bdb190}
[data-theme=ink] .fact.k{background:#fbe6e8;color:var(--bad);border-color:#e6a4ab}
[data-theme=ink] .fact.p{background:#fbf0d8;color:var(--warn);border-color:#e4c88e}
[data-theme=ink] .segs i{background:#e2d8bc;border:1px solid #cfc29b}
[data-theme=ink] .thesis,[data-theme=ink] .axis,[data-theme=ink] .meta{color:var(--mut)}
[data-theme=ink] .meta b{color:var(--txt)}
[data-theme=ink] .sum{color:#3a3628}
[data-theme=ink] .anchor,[data-theme=ink] #decision{background:var(--panel2);border:2px solid var(--line);border-radius:12px 4px 12px 4px;box-shadow:4px 4px 0 var(--line)}
[data-theme=ink] #decision{border-color:var(--good);box-shadow:5px 5px 0 var(--good)}
[data-theme=ink] .anchor .sha{color:var(--acc)}
[data-theme=ink] svg#wires path{stroke:#1b1b1f;stroke-width:2.2;stroke-dasharray:5 4}
[data-theme=ink] .rk .b{background:#e2d8bc}.rk .b i{background:linear-gradient(90deg,var(--acc),var(--good))}
[data-theme=ink] button{background:var(--acc);color:#fff;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line)}
[data-theme=ink] #ctl select{background:#fff;color:var(--txt);border-color:var(--line)}
[data-theme=ink] #budget .bar{background:#e2d8bc}
[data-theme=ink] .crown{display:none!important}
[data-theme=ink] .lane.baseline .badge,[data-theme=ink] .lane.winner .badge{color:#fff}
[data-theme=ink] .segs i{background:#fff;border:1.5px solid #8d8466}
[data-theme=ink] #ticker{color:#3a3628}[data-theme=ink] #ticker span+span::before{color:#3a3628}
[data-theme=ink] .fact,[data-theme=ink] .fact.k,[data-theme=ink] .fact.p{font-weight:600}
[data-theme=ink] .fact.p{color:#7a4a00}[data-theme=ink] .fact.k{color:#9c1d2b}
[data-theme=ink] .chip{font-weight:700}
[data-theme=ink] #pos{color:#3a3628}
[data-theme=ink] button{background:var(--txt);color:#fffaf0;box-shadow:2px 2px 0 var(--acc)}
[data-theme=ink] .rk .b i{background:var(--txt)}
[data-theme=ink] #ctl{border-bottom:2px solid var(--line);background:#fffaf0}
[data-theme=ink] #ctl input[type=range]{accent-color:#1b1b1f}
[data-theme=ink] #budget .bar{border:1px solid #8d8466}[data-theme=ink] #budget .bar i{background:var(--txt)}
[data-theme=ink] .logo b{color:var(--acc)}
[data-theme=ink] .anchor,[data-theme=ink] .lane,[data-theme=ink] #decision{box-shadow:4px 4px 0 var(--line)}
/* ---- decision sheet (themed through variables) ---- */
:root{--sheet:#0e1420;--card:#131b2b;--note:#162036;--hunk:#0a0f19;--add-bg:rgba(61,220,151,.13);--add-fg:#9ff0c9;--del-bg:rgba(255,93,115,.14);--del-fg:#ffb3bd;--scrim:rgba(5,8,13,.82)}
html[data-theme=forge]{--sheet:#17120e;--card:#201912;--note:#2a2016;--hunk:#120d09;--add-bg:rgba(155,229,100,.12);--add-fg:#cdf59f;--del-bg:rgba(255,90,60,.14);--del-fg:#ffb59f;--scrim:rgba(8,5,3,.84)}
html[data-theme=ink]{--sheet:#fffaf0;--card:#fbf3df;--note:#f3e9cb;--hunk:#fffdf6;--add-bg:#dff3e5;--add-fg:#0f5a2c;--del-bg:#fbe1e4;--del-fg:#8e1626;--scrim:rgba(60,50,30,.55)}
#modal{position:fixed;inset:0;background:var(--scrim);display:none;z-index:40;padding:2vh 3vw}
#modal.show{display:block}
#sheet{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;background:var(--sheet);color:var(--txt);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}
#sheet-head{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#sheet-head .ttl{font-weight:700;margin-right:14px}
.tab{background:transparent;border:1px solid transparent;color:var(--mut);border-radius:9px;padding:6px 12px;font:600 13px inherit;cursor:pointer;box-shadow:none}
.tab:hover{color:var(--txt)}.tab.on{color:var(--txt);background:var(--card);border-color:var(--line)}
#sheet-head .sp{flex:1}
#sheet-body{overflow:auto;padding:22px 28px 56px;flex:1}
#sheet h2{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
.hero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.hero .big{font-size:25px;font-weight:800;line-height:1.2}.hero .big em{font-style:normal;color:var(--good)}
.hero .sub{color:var(--mut);margin-top:6px;font-size:13.5px}
.hero .score{margin-left:auto;text-align:right}.hero .score b{font-size:40px;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}.hero .score span{display:block;color:var(--mut);font-size:12px}
.rank{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.rank.win{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.rank .no{font-size:22px;font-weight:800;color:var(--mut);text-align:center}.rank.win .no{color:var(--good)}
.rank .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rank .nm{font-weight:700;font-size:15px}
.rank .bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 10px;position:relative}.rank .bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.rank.win .bar i{background:var(--good)}
.rank .sc{margin-left:auto;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.crit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 14px;margin:2px 0 8px}
.crit div{font-size:11px;color:var(--mut)}.crit div b{color:var(--txt);float:right;font-variant-numeric:tabular-nums}
.crit div u{display:block;height:4px;background:var(--line);border-radius:3px;margin-top:3px;text-decoration:none;overflow:hidden}.crit div u i{display:block;height:100%;background:var(--acc2)}
.flaw{font-size:13px;color:var(--mut);margin-top:6px}.flaw b{color:var(--bad)}
.facts-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pt{display:flex;gap:10px;margin:7px 0;font-size:14px;line-height:1.5}.pt::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:8px}
.pt.good::before{background:var(--good)}.pt.bad::before{background:var(--bad)}.pt.warn::before{background:var(--warn)}
details.lost{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:10px 14px}
details.lost summary{cursor:pointer;font-weight:700}
a.ref,.ref{color:var(--good);cursor:pointer;font:600 11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:4px;text-decoration:none;white-space:nowrap;background:var(--hunk)}
a.ref:hover{border-color:var(--good)}
.cta{display:inline-block;margin-top:12px}
.rpills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rpill{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;cursor:pointer;font:600 13px inherit;box-shadow:none}
.rpill.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.rpill small{color:var(--mut);margin-left:6px;font-weight:500}
.sumline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:4px 0 14px;color:var(--mut);font-size:13px}.sumline b{color:var(--txt)}
.plus{color:var(--add-fg);font-weight:700}.minus{color:var(--del-fg);font-weight:700}

</style>
</head>
<body>
<header>
  <div class="logo">Branch<b>point</b></div>
  <div id="goal"></div>
  <span id="status" class="chip">connecting</span>
  <div id="budget"><small id="btxt">tokens</small><div class="bar"><i id="bbar"></i></div></div>
</header>
<div id="ctl"><button id="play">▶ Play</button><input id="scrub" type="range" min="0" max="0" value="0"><span id="pos">0 / 0</span>
  <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="0.5">0.5×</option></select>
  <select id="theme"><option value="forge">Look: Forge</option><option value="glass">Look: Glass</option><option value="ink">Look: Ink</option></select></div>

<main>
  <div id="trunk"><div class="anchor"><h3>Anchor</h3><div class="sha" id="asha">…</div><p id="asrc"></p><p id="amode"></p></div></div>
  <div id="lanes"><svg id="wires"></svg></div>
  <aside id="sidebar"><div id="decision"></div></aside>
</main>
<div id="ticker"></div>
<div id="modal"><div id="sheet"><div id="sheet-head"></div><div id="sheet-body"></div></div></div>
<div id="pop"></div>
<script>
const STATIC=window.__BP_STATIC__||null;
const RUN="__RUN_ID__", TOKEN="__TOKEN__";
const Q=`t=${encodeURIComponent(TOKEN)}&run=${encodeURIComponent(RUN)}`;
const state={routes:{},order:[],winner:null,runner:null,budget:{used:0,cap:0},decided:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,ref){
  if(STATIC){ if(path==="/state")return STATIC.state; if(path==="/decision")return {markdown:STATIC.decision}; if(path==="/evidence")return STATIC.evidence[ref]||{error:"unknown ref"}; }
  const r=await fetch(`${path}?${Q}${ref?`&ref=${encodeURIComponent(ref)}`:""}`);return r.json()}
const colorFor=n=>n<=3?"var(--good)":n<=6?"var(--warn)":"var(--bad)";
const fmtK=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);
function statusChip(s,f){
  const map={queued:["queued",""],planning:["planning","on pulse"],simulating:["simulating","on pulse"],executing:["building","on pulse"],checking:["checking","warn pulse"],done:["done","good"],failed:["failed","bad"],aborted:["aborted","bad"],skipped:["skipped",""]};
  const [t,c]=map[s]||[s,""];return `<span class="chip ${c}">${t}</span>`}
function laneHTML(r){
  const segs=Array.from({length:10},(_,i)=>`<i style="${i<r.blast?`background:${colorFor(r.blast)}`:""}"></i>`).join("");
  const bp=r.blast_parts||{},facts=[];
  if(bp.dependents)facts.push(`<span class="fact">${bp.dependents} dependent${bp.dependents===1?"":"s"}</span>`);
  if(bp.public_api)facts.push(`<span class="fact k">public API ×${bp.public_api}</span>`);
  if(bp.schema)facts.push(`<span class="fact k">schema ×${bp.schema}</span>`);
  if(bp.config)facts.push(`<span class="fact p">config ×${bp.config}</span>`);
  if(bp.deps)facts.push(`<span class="fact p">new dep ×${bp.deps}</span>`);
  const iss=r.issues||{},ic=[];
  for(const [k,l] of [["test","tests"],["lint","lint"],["type","types"],["runtime","runtime"],["retry","retries"],["predicted","predicted risks"]])
    if(iss[k])ic.push(`<span class="fact ${k==="predicted"?"p":"k"}">${iss[k]} ${iss[k]===1?l.replace(/s$/,"").replace("retrie","retry").replace("predicted risk","predicted risk"):l}</span>`);
  if(!ic.length&&r.status==="done")ic.push(`<span class="fact" style="color:var(--good)">no issues</span>`);
  const c=r.cost||{},f=r.files||{};
  const fid=r.fidelity==="baseline"?"as built":r.fidelity==="execute"?"built":"simulated";
  return `<div class="crown">${state.winner===r.route?"★ WINNER":state.runner===r.route?"RUNNER-UP":""}</div>
  <div class="badge">${esc(r.route)}</div>
  <div class="body"><div class="top"><span class="name">${esc(r.name)}</span><span class="axis">${esc(r.axis)}</span><span class="spacer"></span>
    <span class="chip ${r.fidelity==="execute"?"on":""}">${fid}</span>${statusChip(r.status)}
    ${r.failing?`<span class="chip bad">${r.failing} failing</span>`:""}</div>
  <div class="thesis">${esc(r.thesis)}</div>
  <div class="row"><div class="blast"><label>Blast radius</label><div class="segs">${segs}</div><span class="score" style="color:${colorFor(r.blast)}">${r.blast}/10</span></div>
    <div class="facts">${facts.join("")}</div></div>
  <div class="row" style="margin-top:6px"><div class="facts">${ic.join("")}</div></div>
  <div class="meta"><span>files <b>${f.files??0}</b> <b>+${f.insertions??0}</b> <b>−${f.deletions??0}</b>${f.predicted?" (predicted)":""}</span>
    <span>${c.estimated&&!c.tokens&&!c.tool_calls?"cost <b>unknown</b>":`tokens <b>${fmtK(c.tokens||0)}</b>${c.estimated?" est.":""}`}</span><span>time <b>${Math.round(c.seconds||0)}s</b></span><span>tool calls <b>${c.tool_calls||0}</b></span>
    <span>reversibility <b>${r.reversibility??"–"}/5</b></span></div>
  ${r.summary&&r.summary!==r.thesis?`<div class="sum">${esc(r.summary)}</div>`:""}</div>`}
function render(){
  const host=$("#lanes");
  for(const id of state.order){
    let el=document.getElementById("lane-"+id);
    const r=state.routes[id];
    if(!el){el=document.createElement("div");el.id="lane-"+id;host.appendChild(el)}
    el.className="lane"+(r.fidelity==="baseline"?" baseline":"")+(["simulating","executing","checking","planning"].includes(r.status)?" active":"")+(r.failing&&r.status==="done"?" failing":"")+(r.status==="done"?" done":"")+(state.decided?(state.winner===id?" winner":state.runner===id?" runner":" dim"):"");
    el.innerHTML=laneHTML(r);
  }
  drawWires();
  const b=state.budget;$("#btxt").textContent=`tokens ${fmtK(b.used)} / ${b.cap?fmtK(b.cap):"∞"}`;$("#bbar").style.width=b.cap?Math.min(100,100*b.used/b.cap)+"%":"0";
}
function drawWires(){
  const svg=$("#wires"),host=$("#lanes"),h=host.offsetHeight;svg.setAttribute("viewBox",`0 0 70 ${h}`);
  const ar=document.querySelector('.anchor').getBoundingClientRect(),hr=host.getBoundingClientRect();
  const mid=Math.max(30,Math.min(h-30,ar.top+ar.height/2-hr.top)),n=state.order.length,paths=[];
  state.order.forEach((id,i)=>{const el=document.getElementById("lane-"+id);if(!el)return;
    const y0=mid+(i-(n-1)/2)*10,y=el.offsetTop+34,win=state.decided&&state.winner===id,col=state.decided?(win?"#3ddc97":"#3a4f80"):"#4a67b0";
    paths.push(`<path d="M0 ${y0} C 34 ${y0}, 28 ${y}, 62 ${y}" style="stroke:${col};stroke-width:${win?3:2}"/><circle cx="62" cy="${y}" r="3.5" fill="${col}"/>`)});
  svg.innerHTML=paths.join("");
}
let lastTick="";
function tick(msg){if(msg===lastTick)return;lastTick=msg;const t=$("#ticker");const s=document.createElement("span");s.textContent=msg;t.appendChild(s);while(t.children.length>5)t.removeChild(t.firstChild)}
function showDecision(ev){
  state.decided=true;state.winner=ev.winner;state.runner=ev.runner_up;
  const w=state.routes[ev.winner];
  const rows=(ev.ranking||[]).map(r=>`<div class="rk"><b>${esc(r.route)}</b><div><div style="font-size:12px;color:var(--mut)">${esc(r.name)}</div><div class="b"><i style="width:${r.score*10}%"></i></div></div><span>${r.score}</span></div>`).join("");
  $("#decision").innerHTML=`<h2>Council verdict: Route <em>${esc(ev.winner)}</em>${w?` — ${esc(w.name)}`:""}</h2><div style="color:var(--mut);font-size:11.5px;margin:-2px 0 6px">weighted score out of 10 · three blind reviewers + judge</div>${rows}<div style="margin-top:10px;display:flex;gap:10px;align-items:center"><button onclick="openSheet('verdict')">Open Decision Record</button><span class="chip ${ev.confidence==="high"?"good":ev.confidence==="low"?"warn":"on"}">confidence: ${esc(ev.confidence||"medium")}</span></div>`;
  $("#decision").classList.add("show");document.querySelector("main").classList.add("has-decision");render();
  setTimeout(()=>{document.querySelectorAll("#decision .rk i").forEach((e,i)=>e.style.width=(ev.ranking[i].score*10)+"%")},60);
}
function inline(s){return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>")}
function md(src){
  const lines=esc(src).split("\n"),out=[];let i=0;
  const linkRefs=t=>t.replace(/\[<code>([A-Z]\d?:[a-z]+:[\w.\-\/#]+)<\/code>\]/g,(m,r)=>`<a class="ref" data-ref="${r}">${r}</a>`);
  while(i<lines.length){const l=lines[i];
    if(l.startsWith("```")){const buf=[];i++;while(i<lines.length&&!lines[i].startsWith("```")){buf.push(lines[i]);i++}i++;out.push(`<pre>${buf.join("\n")}</pre>`);continue}
    if(/^\|/.test(l)&&/^\|[-| ]+\|$/.test(lines[i+1]||"")){const head=l.split("|").slice(1,-1);i+=2;const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split("|").slice(1,-1));i++}
      out.push(`<table><tr>${head.map(c=>`<th>${linkRefs(inline(c.trim()))}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${linkRefs(inline(c.trim()))}</td>`).join("")}</tr>`).join("")}</table>`);continue}
    let m;
    if((m=l.match(/^(#{1,3}) (.*)/))){out.push(`<h${m[1].length}>${linkRefs(inline(m[2]))}</h${m[1].length}>`);i++;continue}
    if(l.startsWith("&gt; ")){out.push(`<blockquote>${linkRefs(inline(l.slice(5)))}</blockquote>`);i++;continue}
    if(/^- /.test(l)){const items=[];while(i<lines.length&&/^- /.test(lines[i])){items.push(lines[i].slice(2));i++}out.push(`<ul>${items.map(x=>`<li>${linkRefs(inline(x))}</li>`).join("")}</ul>`);continue}
    if(l.trim()===""){i++;continue}
    out.push(`<p>${linkRefs(inline(l))}</p>`);i++}
  return out.join("\n")}
let DETAIL=null,sheetTab="verdict",sheetRoute=null;
const W={goal_fit:.30,correctness:.25,blast_radius:.20,simplicity:.10,reversibility:.10,cost:.05};
const CRIT=[["goal_fit","Goal fit"],["correctness","Correctness"],["blast_radius","Blast radius"],["simplicity","Simplicity"],["reversibility","Reversibility"],["cost","Cost"]];
const refChip=r=>`<a class="ref" data-ref="${esc(r)}">${esc(r)}</a>`;
const refsOf=a=>(a||[]).map(refChip).join("");
const rname=id=>{const l=(DETAIL.ledgers||{})[id];return l&&l.strategy?l.strategy.name:id};
async function loadDetail(){if(DETAIL)return DETAIL;DETAIL=STATIC?STATIC.detail:await api("/detail");return DETAIL}
async function openSheet(tab,route,ref){await loadDetail();sheetTab=tab||"verdict";if(route)sheetRoute=route;
  if(!sheetRoute){const d=DETAIL.decision.data||{};sheetRoute=d.winner||Object.keys(DETAIL.ledgers)[0]}
  $("#modal").classList.add("show");renderSheet();if(ref)focusHunk(ref)}
const openDoc=()=>openSheet("verdict");
function closeDoc(){$("#modal").classList.remove("show");$("#pop").style.display="none"}
function renderSheet(){
  const tabs=[["verdict","Verdict"],["changes","Changes ±"],["record","Full record"]];
  $("#sheet-head").innerHTML=`<span class="ttl">Decision Record</span>`+tabs.map(([k,l])=>`<button class="tab ${k===sheetTab?"on":""}" data-tab="${k}">${l}</button>`).join("")+`<span class="sp"></span><button class="tab" id="sheet-x">Close ✕</button>`;
  $("#sheet-head").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{sheetTab=b.dataset.tab;renderSheet()});$("#sheet-x").onclick=closeDoc;
  const body=$("#sheet-body");body.innerHTML=sheetTab==="verdict"?verdictHTML():sheetTab==="changes"?changesHTML():`<div class="md">${md(DETAIL.decision.markdown||"No decision record yet.")}</div>`;
  body.scrollTop=0;
  body.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{sheetRoute=b.dataset.route;if(b.dataset.go){sheetTab=b.dataset.go}renderSheet()});
}
function verdictHTML(){
  const d=DETAIL.decision.data||{},L=DETAIL.ledgers,rank=d.ranking||[],nar=d.narrative||{},win=d.winner,wl=L[win]||{},top=rank[0]||{},run=rank[1];
  const conf=nar.confidence||"medium",simW=wl.fidelity==="simulate";
  let h=`<div class="hero"><div><div style="font-size:11px;letter-spacing:1px;color:var(--mut)">COUNCIL DECISION</div>
    <div class="big">Adopt Route <em>${esc(win)}</em> — ${esc(rname(win))}</div>
    <div class="sub">${esc((wl.strategy||{}).thesis||"")}</div>
    <div class="facts-row" style="margin-top:10px"><span class="chip ${conf==="high"?"good":conf==="low"?"warn":"on"}">confidence: ${esc(conf)}</span>
      ${run?`<span class="chip">runner-up: ${esc(run.route)} · ${run.score}</span>`:""}${simW?`<span class="chip warn">winner was simulated, not built</span>`:`<span class="chip good">built &amp; checked</span>`}</div>
    ${nar.confidence_note?`<div class="sub" style="margin-top:8px">Why this confidence: ${esc(nar.confidence_note)}.</div>`:""}</div>
    <div class="score"><b>${top.score??""}</b><span>weighted score / 10</span></div></div>`;
  h+=`<h2>How the routes compare</h2>`;
  rank.forEach(r=>{const l=L[r.route]||{},fl=worstFlaw(r.route),f=l.diff_stats||{},bl=l.blast||{},cs=l.cost||{};
    h+=`<div class="rank ${r.route===win?"win":""}"><div class="no">${r.rank}</div><div>
      <div class="row1"><span class="nm">Route ${esc(r.route)} · ${esc(r.name)}</span><span class="chip ${l.fidelity==="execute"?"on":""}">${l.fidelity==="baseline"?"your build":l.fidelity==="execute"?"built":"simulated"}</span><span class="sc">${r.score}</span></div>
      <div class="bar"><i style="width:${Math.max(2,r.score*10)}%"></i></div>
      <div class="crit">${CRIT.map(([k,lab])=>`<div>${lab}<b>${(r.criteria||{})[k]}</b><u><i style="width:${((r.criteria||{})[k]||0)*10}%"></i></u></div>`).join("")}</div>
      <div class="facts-row"><span class="fact" title="raw blast score: 0 = no knock-on effects, 10 = widest">impact ${bl.score}/10 (lower = safer)</span><span class="fact">${f.files||0} file${(f.files||0)===1?"":"s"} <span class="plus">+${f.insertions||0}</span> <span class="minus">−${f.deletions||0}</span>${f.predicted?" (predicted)":""}</span>
        <span class="fact ${(l.issues||[]).length?"k":""}">${(l.issues||[]).length} issue${(l.issues||[]).length===1?"":"s"}</span><span class="fact">${cs.estimated&&!cs.tokens&&!cs.tool_calls?"cost unknown":(cs.tokens||0)+" tok"+(cs.estimated?" est.":"")}</span><span class="fact">reversibility ${l.reversibility}/5</span></div>
      ${whyLine(r,rank,win)}${weakest(r)}
      ${fl?`<div class="flaw"><b style="color:var(--mut)">${esc(fl.who)}, worst flaw</b>: ${esc(fl.text)} ${refsOf(fl.refs)}</div>`:""}
      <button class="rpill cta" data-route="${esc(r.route)}" data-go="changes">See its changes ±</button></div></div>`});
  h+=`<h2>Why Route ${esc(win)} won</h2>`+(nar.winner_why||[]).map(s=>`<div class="pt good"><div>${esc(clean(s.text))} ${refsOf(s.refs)}</div></div>`).join("");
  const losers=rank.slice(1);
  h+=`<h2>Why the others lost</h2>`+losers.map(r=>`<details class="lost"><summary>Route ${esc(r.route)} · ${esc(r.name)} <span style="color:var(--mut);font-weight:500">— ${r.score}, #${r.rank}</span></summary>`+
     ((nar.losers||{})[r.route]||[]).map(s=>`<div class="pt bad"><div>${esc(clean(s.text))} ${refsOf(s.refs)}</div></div>`).join("")+`</details>`).join("");
  if((nar.risks_carried||[]).length)h+=`<h2>Risks carried forward</h2>`+nar.risks_carried.map(s=>`<div class="pt warn"><div>${esc(clean(s.text))} ${refsOf(s.refs)}</div></div>`).join("");
  if((nar.borrow||[]).length)h+=`<h2>Worth borrowing from the others</h2>`+nar.borrow.map(s=>`<div class="pt"><div><b>Route ${esc(s.from)}:</b> ${esc(clean(s.text))} ${refsOf(s.refs)}</div></div>`).join("");
  return h}
function clean(t){return String(t||"").replace(/\s*[\[(]`?[A-Z]\d?:[a-z]+:[\w\-\/#.]+`?[\])]/g,"").replace(/\s{2,}/g," ").trim()}

function whyLine(r,rank,win){const c=r.criteria||{},w=rank.find(x=>x.route===win)||{},wc=w.criteria||{},lab=Object.fromEntries(CRIT);
  const gaps=CRIT.map(([k])=>[k,((c[k]||0)-(wc[k]||0))*W[k]]);
  if(r.route===win){const run=rank[1];if(!run)return"";const rc=run.criteria||{};
    const lead=CRIT.map(([k])=>[k,((c[k]||0)-(rc[k]||0))*W[k]]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0.05).slice(0,2);
    return `<div class="why"><b>Won by ${(r.score-run.score).toFixed(2)}</b> over ${esc(run.route)}`+(lead.length?` — mostly ${lead.map(([k,v])=>`${lab[k]} (+${v.toFixed(2)})`).join(", ")}`:"")+`.</div>`}
  const loss=gaps.filter(x=>x[1]<-0.05).sort((a,b)=>a[1]-b[1]).slice(0,2),gain=gaps.filter(x=>x[1]>0.05).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="why"><b class="lo">Behind ${esc(win)} by ${(w.score-r.score).toFixed(2)}</b>`+(loss.length?` — cost it: ${loss.map(([k,v])=>`${lab[k]} (${v.toFixed(2)})`).join(", ")}`:"")+(gain?`; it was stronger on ${lab[gain[0]]}`:"")+`.</div>`}
function weakest(r){const c=r.criteria||{};const k=CRIT.map(([k,l])=>[l,c[k]||0]).sort((a,b)=>a[1]-b[1])[0];return k?`<div class="flaw"><b>Weakest area</b>: ${esc(k[0])} ${k[1]}/10</div>`:""}
function worstFlaw(rid){for(const rv of DETAIL.reviews||[]){const f=(rv.flaws||{})[rid];if(f&&f.text)return {who:rv.persona,text:clean(f.text),refs:f.refs||[]}}return null}
function diffLines(text){const ls=String(text).split("\n");return ls.slice(1).map(l=>{const c=l[0];const k=c==="+"?"a":c==="-"?"d":"c";return `<span class="${k}" data-s="${c==="+"||c==="-"?c:" "}">${esc(l.slice(1)||" ")}</span>`}).join("")}
function hunkStats(text){let a=0,d=0;String(text).split("\n").slice(1).forEach(l=>{if(l[0]==="+")a++;else if(l[0]==="-")d++});return [a,d]}
function changesHTML(){
  const L=DETAIL.ledgers,ids=Object.keys(L),win=(DETAIL.decision.data||{}).winner;
  let h=`<div class="rpills">`+ids.map(id=>`<button class="rpill ${id===sheetRoute?"on":""}" data-route="${esc(id)}">${id===win?"★ ":""}Route ${esc(id)}<small>${esc(rname(id))}</small></button>`).join("")+`</div>`;
  const l=L[sheetRoute]||{},ev=DETAIL.evidence,C=DETAIL.comments||{},st=l.diff_stats||{};
  h+=`<div class="sumline"><span><b>${esc(rname(sheetRoute))}</b> — ${esc((l.strategy||{}).thesis||"")}</span></div>
    <div class="sumline"><span>${st.files||0} file${(st.files||0)===1?"":"s"} <span class="plus">+${st.insertions||0}</span> <span class="minus">−${st.deletions||0}</span>${st.predicted?" (predicted, not built)":""}</span>
    <span>impact <b>${(l.blast||{}).score}/10</b> (lower = safer) ${refsOf((l.blast||{}).evidence_ref?[l.blast.evidence_ref]:[])}</span><span>reversibility <b>${l.reversibility}/5</b></span>
    ${(l.issues||[]).filter(i=>i.kind!=="predicted").length?`<span class="minus">${(l.issues||[]).filter(i=>i.kind!=="predicted").length} issue(s)</span>`:`<span class="plus">no issues recorded</span>`}</div>`;
  const hunks=Object.entries(ev).filter(([k,v])=>k.startsWith(sheetRoute+":diff:")&&v.kind==="diff");
  if(hunks.length){
    const byFile={};hunks.forEach(([k,v])=>{const f=(v.title||"").split(" @@")[0];(byFile[f]=byFile[f]||[]).push([k,v])});
    Object.entries(byFile).forEach(([f,hs])=>{let a=0,d=0;hs.forEach(([k,v])=>{const t=hunkStats(v.text);a+=t[0];d+=t[1]});
      const seen=new Set(),fileFacts=[];hs.forEach(([k])=>(C[k]||[]).filter(n=>n.kind==="fact").forEach(n=>{const key=n.source+n.text;if(!seen.has(key)){seen.add(key);fileFacts.push([k,n])}}));
      h+=`<div class="file"><div class="fh">${esc(f)} <span class="plus">+${a}</span> <span class="minus">−${d}</span></div>`;
      if(fileFacts.length)h+=`<div class="notes filenotes">`+fileFacts.map(([k,n])=>`<div class="note fact"><span class="who">${esc(n.source)}</span><span>${esc(n.text)} ${refChip(k)}</span></div>`).join("")+`</div>`;
      hs.forEach(([k,v])=>{const notes=(C[k]||[]).filter(n=>n.kind!=="fact");
        h+=`<div class="hunk" id="hk-${esc(k.replace(/[^\w]/g,"_"))}"><div class="hh">@@ ${esc((v.title||"").split("@@ ")[1]||"")} ${refChip(k)}</div><pre class="diff">${diffLines(v.text)}</pre>`+
          (notes.length?`<div class="notes">`+notes.map(n=>`<div class="note ${esc(n.kind)}"><span class="who">${esc(n.source)}</span><span>${esc(n.text)}</span></div>`).join("")+`</div>`:"")+`</div>`});
      h+=`</div>`});
  }else{
    const plan=ev[sheetRoute+":plan:md"];
    h+=`<h2>This route was simulated, so there is no diff</h2><div class="sumline">What the plan says it would do, and what the tracer predicted:</div>`;
    if(plan)h+=`<div class="plan">${esc(plan.text)} </div> ${refChip(sheetRoute+":plan:md")}`;
    h+=`<h2>Files it would touch</h2>`+(l.files||[]).map(f=>`<div class="pt"><div><code>${esc(f.path)}</code> — ${esc(f.action)}, ~${f.insertions} lines ${(f.symbols||[]).length?`(${esc(f.symbols.join(", "))})`:""}</div></div>`).join("");
    const risks=(l.issues||[]).filter(i=>i.kind==="predicted");
    if(risks.length)h+=`<h2>Predicted risks</h2>`+risks.map(i=>`<div class="pt warn"><div>${esc(i.detail)} ${refChip(i.evidence_ref)}</div></div>`).join("");
  }
  const checks=(l.issues||[]).filter(i=>["test","lint","type"].includes(i.kind));
  if(checks.length)h+=`<h2>Failing checks</h2>`+checks.map(i=>`<div class="pt bad"><div><b>${esc(i.kind)}</b> ${esc(i.detail)} ${refChip(i.evidence_ref)}</div></div>`).join("");
  const facts=[["Public API",(l.blast||{}).public_api],["Schema / migrations",(l.blast||{}).schema],["Config / env",(l.blast||{}).config],["New dependencies",l.deps_added]].filter(x=>(x[1]||[]).length);
  if(facts.length)h+=`<h2>Blast-radius facts</h2>`+facts.map(([lab,items])=>`<div class="pt warn"><div><b>${lab}:</b> ${items.map(esc).join("; ")}</div></div>`).join("");
  return h}
function focusHunk(ref){const el=document.getElementById("hk-"+ref.replace(/[^\w]/g,"_"));if(el){el.scrollIntoView({block:"center"});el.classList.add("flash")}}
$("#modal").addEventListener("click",async e=>{const a=e.target.closest("a.ref");if(!a)return;
  const ref=a.dataset.ref,m=ref.match(/^([A-Z]\d?):diff:/);
  if(m&&sheetTab!=="changes"){sheetRoute=m[1];sheetTab="changes";renderSheet();focusHunk(ref);return}
  if(m){focusHunk(ref);return}
  const ev=await api("/evidence",ref);const p=$("#pop");p.innerHTML=`<h4>${esc(ref)} — ${esc(ev.title||"")}</h4><pre>${esc(ev.text||ev.error||"")}</pre>`;
  const b=a.getBoundingClientRect();p.style.display="block";p.style.left=Math.max(8,Math.min(b.left,innerWidth-660))+"px";p.style.top=Math.max(8,Math.min(b.bottom+6,innerHeight-p.offsetHeight-12))+"px"});

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDoc()});
document.addEventListener("click",e=>{if(!e.target.closest("a.ref")&&!e.target.closest("#pop"))$("#pop").style.display="none"});
function onEvent(ev){
  switch(ev.type){
    case"strategies":
      $("#goal").innerHTML=`<q>${esc(ev.anchor.goal)}</q>`;
      $("#asha").textContent=ev.anchor.base;$("#asrc").textContent="from "+ev.anchor.source.replace(/-/g," ");
      $("#amode").textContent=ev.anchor.mode==="rewind"?`rewound to prompt ${ev.anchor.prompt_n}`:"forked from now";
      for(const s of ev.strategies){if(!state.routes[s.id]){state.order.push(s.id);state.routes[s.id]={route:s.id,name:s.name,axis:s.axis,thesis:s.thesis,status:"queued",fidelity:s.baseline?"baseline":"simulate",blast:0,issues:{},cost:{},files:{}}}}
      render();tick(`${ev.strategies.length} distinct routes${ev.rejected&&ev.rejected.length?` (${ev.rejected.length} near-duplicates rejected)`:""}`);break;
    case"route":{const r=state.routes[ev.route]||(state.order.push(ev.route),state.routes[ev.route]={});Object.assign(r,ev);
      if(ev.budget_used!=null)state.budget={used:ev.budget_used,cap:ev.budget_cap||state.budget.cap};render();tick(`${ev.route} ${ev.status} · blast ${ev.blast}/10 · ${ev.issue_total} issues`);break}
    case"status":$("#status").className="chip "+(["decided","adopted"].includes(ev.status)?"good":["failed","aborted"].includes(ev.status)?"bad":"on pulse");$("#status").textContent=ev.status;
      if(ev.budget_used!=null)state.budget.used=ev.budget_used;if(ev.budget_cap!=null)state.budget.cap=ev.budget_cap;render();tick("run "+ev.status);break;
    case"budget":state.budget={used:ev.used,cap:ev.cap};render();break;
    case"decision":showDecision(ev);tick(`council: Route ${ev.winner} wins`);break;
    case"route_log":case"log":tick(ev.message);break;
    case"base_checks":tick("baseline checks: "+(ev.results||[]).map(r=>r.kind+" "+(r.passed?"ok":"fail")).join(", "));break;
  }
}
const PARAMS=new URLSearchParams(location.search),REPLAY=PARAMS.get("replay"),UPTO=PARAMS.get("upto");
let EVS=[],playing=false,pos=0,timer=null,speed=parseFloat(REPLAY)||1;
function resetAll(){state.routes={};state.order=[];state.winner=state.runner=null;state.decided=false;state.budget.used=0;
  document.querySelectorAll("#lanes .lane").forEach(e=>e.remove());$("#decision").classList.remove("show");document.querySelector("main").classList.remove("has-decision");$("#ticker").innerHTML="";lastTick="";$("#status").className="chip";$("#status").textContent="start";render()}
function seek(n){resetAll();pos=Math.max(0,Math.min(EVS.length,n));EVS.slice(0,pos).forEach(onEvent);$("#scrub").value=pos;$("#pos").textContent=pos+" / "+EVS.length}
function delayFor(i){const e=EVS[i],n=EVS[i+1];return n?Math.max(220,Math.min(1500,(n.ts-e.ts)*1000/speed)):0}
function step(){if(!playing)return;if(pos>=EVS.length){setPlaying(false);return}onEvent(EVS[pos]);pos++;$("#scrub").value=pos;$("#pos").textContent=pos+" / "+EVS.length;timer=setTimeout(step,delayFor(pos-1))}
function setPlaying(v){playing=v;$("#play").textContent=v?"❚❚ Pause":"▶ Play";clearTimeout(timer);if(v){if(pos>=EVS.length)seek(0);step()}}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("bp-theme",t)}catch(e){}$("#theme").value=t;setTimeout(drawWires,50)}
setTheme(PARAMS.get("theme")||(()=>{try{return localStorage.getItem("bp-theme")}catch(e){return null}})()||"forge");
$("#theme").onchange=e=>setTheme(e.target.value);
if(UPTO||REPLAY||STATIC){
  document.body.classList.add("player");
  api("/state").then(j=>{EVS=j.events||[];state.budget.cap=(j.meta.settings||{}).budget_tokens||0;$("#scrub").max=EVS.length;
    $("#play").onclick=()=>setPlaying(!playing);$("#scrub").oninput=e=>{setPlaying(false);seek(parseInt(e.target.value))};
    $("#speed").onchange=e=>{speed=parseFloat(e.target.value)};
    if(UPTO){seek(parseInt(UPTO))}else{seek(0);setPlaying(true)}});
}else{const es=new EventSource(`/events?${Q}`);es.onmessage=m=>onEvent(JSON.parse(m.data));es.onerror=()=>{$("#status").textContent="reconnecting…"};
  api("/state").then(j=>{const s=j.meta&&j.meta.settings||{};state.budget.cap=s.budget_tokens||0;state.budget.used=j.meta.tokens_used||0;render()}).catch(()=>{});}
window.addEventListener("resize",drawWires);
</script>
